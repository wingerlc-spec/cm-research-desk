name: screen-v2
on:
  schedule:
    - cron: "30 23 * * 1-5"   # 5:30pm CT (CST, from 1 Nov). When CDT returns in March: "30 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas numpy matplotlib beautifulsoup4 openpyxl
      - run: rm -rf out/charts && python screen.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: terminal data pulls (a failure here must not fail the screen)
        continue-on-error: true
        run: python terminal_pulls.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: datasets (history snapshots, pattern screens, drivers, rule test; must not fail the screen)
        continue-on-error: true
        timeout-minutes: 25
        run: python datasets.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - run: |
          git config user.name "cm-screen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A out
          git commit -m "screen $(date -u +%F)" || echo "nothing to commit"
          git push
